<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>运动健康 Agent · Onboarding 交互原型</title>
<style>
:root {
  --primary: #0EA5E9;
  --primary-dark: #0284C7;
  --indigo: #6366F1;
  --bg: #E8EDF2;
  --white: #FFFFFF;
  --agent-bubble: #F1F5F9;
  --agent-text: #1E293B;
  --border: #E2E8F0;
  --muted: #64748B;
  --green: #10B981;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
  background: var(--bg);
  min-height: 100vh;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 32px 16px;
  gap: 28px;
}

/* ── PHONE FRAME ─────────────────────────────────────── */
.phone-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  flex-shrink: 0;
}

.phone-label {
  font-size: 11px;
  color: var(--muted);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-bottom: 10px;
}

.phone {
  width: 375px;
  height: 812px;
  background: #fff;
  border-radius: 50px;
  box-shadow:
    0 0 0 10px #1A1A1A,
    0 0 0 11px #3A3A3A,
    0 32px 72px rgba(0,0,0,0.35);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  position: relative;
}

/* Notch */
.notch {
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 120px;
  height: 28px;
  background: #1A1A1A;
  border-radius: 0 0 18px 18px;
  z-index: 10;
}

/* Status bar */
.status-bar {
  background: var(--white);
  padding: 14px 28px 6px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  padding-top: 18px;
}
.status-time { font-size: 15px; font-weight: 700; color: #0F172A; }
.status-icons { display: flex; align-items: center; gap: 5px; font-size: 13px; color: #0F172A; }

/* App header */
.app-header {
  background: var(--white);
  padding: 10px 22px 14px;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border);
}

.progress-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 10px;
}
.progress-steps {
  display: flex;
  gap: 5px;
  flex: 1;
}
.progress-dot {
  flex: 1;
  height: 3px;
  border-radius: 2px;
  background: var(--border);
  transition: background 0.5s ease;
}
.progress-dot.done { background: var(--primary); }
.progress-dot.active { background: var(--primary); opacity: 0.5; }

.progress-text {
  font-size: 11px;
  color: var(--muted);
  white-space: nowrap;
}
.stage-title {
  font-size: 17px;
  font-weight: 700;
  color: var(--agent-text);
  transition: opacity 0.3s;
}
.stage-subtitle {
  font-size: 12px;
  color: var(--muted);
  margin-top: 2px;
  transition: opacity 0.3s;
}

/* Messages area */
.messages {
  flex: 1;
  overflow-y: auto;
  padding: 14px 14px 8px;
  scroll-behavior: smooth;
  -webkit-overflow-scrolling: touch;
}
.messages::-webkit-scrollbar { display: none; }

/* Message bubbles */
.msg {
  margin-bottom: 10px;
  animation: msgIn 0.28s cubic-bezier(0.34,1.56,0.64,1) both;
}
@keyframes msgIn {
  from { opacity: 0; transform: translateY(10px) scale(0.97); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

.msg.agent { display: flex; align-items: flex-end; gap: 7px; }
.msg.user  { display: flex; justify-content: flex-end; }

.avatar {
  width: 30px; height: 30px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--primary), var(--indigo));
  display: flex; align-items: center; justify-content: center;
  font-size: 15px;
  flex-shrink: 0;
}

.bubble {
  max-width: 78%;
  padding: 9px 13px;
  border-radius: 17px;
  font-size: 14px;
  line-height: 1.55;
}
.agent .bubble {
  background: var(--agent-bubble);
  color: var(--agent-text);
  border-bottom-left-radius: 4px;
}
.user .bubble {
  background: var(--primary);
  color: #fff;
  border-bottom-right-radius: 4px;
  font-size: 13px;
}

/* Typing indicator */
.typing-wrap {
  display: flex; align-items: flex-end; gap: 7px;
  margin-bottom: 10px;
  animation: msgIn 0.2s ease both;
}
.typing-bubble {
  background: var(--agent-bubble);
  padding: 11px 14px;
  border-radius: 17px;
  border-bottom-left-radius: 4px;
  display: flex; gap: 4px; align-items: center;
}
.typing-bubble i {
  display: block;
  width: 6px; height: 6px;
  border-radius: 50%;
  background: #94A3B8;
  animation: tdot 1.2s ease-in-out infinite;
}
.typing-bubble i:nth-child(2) { animation-delay: 0.18s; }
.typing-bubble i:nth-child(3) { animation-delay: 0.36s; }
@keyframes tdot {
  0%,60%,100% { transform: translateY(0); background: #94A3B8; }
  30% { transform: translateY(-5px); background: var(--primary); }
}

/* ── INTERACTION AREA ────────────────────────────────── */
.interaction {
  padding: 12px 14px 20px;
  background: var(--white);
  border-top: 1px solid var(--border);
  flex-shrink: 0;
  min-height: 200px;
  max-height: 310px;
  overflow-y: auto;
}
.interaction::-webkit-scrollbar { display: none; }

/* Fade-in for interaction content */
.interaction-inner {
  animation: fadeUp 0.3s ease both;
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ── MOOD GRID (Apple Health style) ─────────────────── */
.mood-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 7px;
}

.mood-card {
  border-radius: 18px;
  padding: 13px 6px 11px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
  cursor: pointer;
  border: 2.5px solid transparent;
  transition: transform 0.18s, box-shadow 0.18s, border-color 0.18s, opacity 0.25s;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.mood-card:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,0,0,0.12); }
.mood-card:active { transform: scale(0.94); }
.mood-card.selected {
  border-color: rgba(255,255,255,0.9);
  box-shadow: 0 0 0 3px var(--primary), 0 6px 20px rgba(0,0,0,0.15);
  transform: translateY(-2px);
}
.mood-card.dimmed { opacity: 0.38; pointer-events: none; }

.mood-card .mood-emoji {
  font-size: 28px;
  line-height: 1;
  filter: drop-shadow(0 1px 2px rgba(0,0,0,0.15));
}
.mood-card .mood-name {
  font-size: 11.5px;
  font-weight: 700;
  color: rgba(255,255,255,0.97);
  text-align: center;
  letter-spacing: -0.01em;
}
.mood-card .mood-desc {
  font-size: 10px;
  color: rgba(255,255,255,0.72);
  text-align: center;
  line-height: 1.3;
}

/* ── OPTION LIST ─────────────────────────────────────── */
.option-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.opt-btn {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 12px;
  border: 1.5px solid var(--border);
  border-radius: 12px;
  cursor: pointer;
  background: var(--white);
  text-align: left;
  font-family: inherit;
  transition: border-color 0.15s, background 0.15s, opacity 0.25s, transform 0.15s;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.opt-btn:hover { border-color: var(--primary); background: #F0F7FF; }
.opt-btn:active { transform: scale(0.98); }
.opt-btn.selected { border-color: var(--primary); background: #EFF6FF; }
.opt-btn.dimmed { opacity: 0.38; pointer-events: none; }

.opt-icon { font-size: 20px; flex-shrink: 0; }
.opt-text { flex: 1; min-width: 0; }
.opt-main { font-size: 13px; font-weight: 500; color: var(--agent-text); }
.opt-sub  { font-size: 11px; color: var(--muted); margin-top: 1px; }

/* ── SUMMARY CARD ────────────────────────────────────── */
.summary-card {
  background: linear-gradient(135deg, #0EA5E9 0%, #6366F1 100%);
  border-radius: 16px;
  padding: 14px 16px;
  color: #fff;
  margin-bottom: 10px;
}
.summary-card h4 {
  font-size: 12px;
  font-weight: 600;
  opacity: 0.8;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  margin-bottom: 10px;
}
.summary-row {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  padding: 5px 0;
  font-size: 13px;
  border-bottom: 1px solid rgba(255,255,255,0.15);
}
.summary-row:last-child { border-bottom: none; }
.summary-row .si { font-size: 15px; flex-shrink: 0; margin-top: 1px; }

.action-btn {
  width: 100%;
  padding: 13px;
  background: var(--primary);
  color: #fff;
  border: none;
  border-radius: 12px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  transition: background 0.2s, transform 0.15s;
  -webkit-tap-highlight-color: transparent;
}
.action-btn:hover { background: var(--primary-dark); }
.action-btn:active { transform: scale(0.98); }
.action-btn.success { background: var(--green); }

/* ── NOTES PANEL ─────────────────────────────────────── */
.notes-panel {
  width: 280px;
  flex-shrink: 0;
  padding-top: 44px;
}

.notes-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}
.notes-header h2 {
  font-size: 13px;
  font-weight: 700;
  color: var(--agent-text);
  letter-spacing: 0.02em;
}
.restart-btn {
  font-size: 11px;
  color: var(--primary);
  cursor: pointer;
  padding: 4px 8px;
  border: 1px solid var(--primary);
  border-radius: 6px;
  background: none;
  font-family: inherit;
  transition: background 0.15s;
}
.restart-btn:hover { background: #EFF6FF; }

.stage-pills {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-bottom: 14px;
}
.pill {
  padding: 3px 9px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 500;
  background: var(--border);
  color: var(--muted);
  cursor: pointer;
  transition: all 0.2s;
  border: none;
  font-family: inherit;
}
.pill.active { background: var(--primary); color: #fff; }

.note-card {
  background: #fff;
  border-radius: 14px;
  padding: 14px 16px;
  margin-bottom: 10px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.05);
  animation: fadeUp 0.3s ease both;
}
.note-card-title {
  font-size: 12px;
  font-weight: 700;
  color: var(--agent-text);
  display: flex;
  align-items: center;
  gap: 5px;
  margin-bottom: 10px;
}
.note-card-title::before {
  content: '';
  display: block;
  width: 3px;
  height: 12px;
  background: var(--primary);
  border-radius: 2px;
}

.note-item {
  padding: 6px 0;
  border-bottom: 1px solid var(--border);
  font-size: 12px;
  line-height: 1.55;
  color: #475569;
}
.note-item:last-child { border-bottom: none; padding-bottom: 0; }
.note-item b { color: var(--agent-text); display: block; margin-bottom: 2px; }

.ref-tag {
  display: inline-block;
  padding: 2px 7px;
  border-radius: 4px;
  font-size: 10px;
  font-weight: 600;
  margin-right: 4px;
  margin-top: 3px;
}
.ref-apple  { background: #F1F5F9; color: #334155; }
.ref-noom   { background: #FFF7ED; color: #9A3412; }
.ref-future { background: #F0FDF4; color: #166534; }
.ref-head   { background: #FEF3C7; color: #92400E; }

/* ── RESPONSIVE ──────────────────────────────────────── */
@media (max-width: 720px) {
  body { flex-direction: column; align-items: center; padding: 16px; }
  .notes-panel { width: 100%; max-width: 375px; padding-top: 0; }
}
@media (max-width: 400px) {
  .phone { width: 100%; height: auto; border-radius: 0; box-shadow: none; }
  body { padding: 0; background: #fff; }
}
</style>
</head>

          { b: '没有错误答案', t: '所有选项都获得接纳性回应，不引发评判。"没有方向"和"跃跃欲试"同样被肯定和接住。' },

          { b: '副标题降低认知负担', t: '主文字简洁，副文字补充说明，帮助不确定的用户找到最接近自己的选项。' },
          { b: '回应建立被理解感', t: 'Agent 不只"记录"答案，而是用回应证明它理解这个目标背后的含义和真实处境。' }

          { b: '根据经历分叉流程', t: '有停止史的用户多一步障碍识别；有基础的用户直接进入日常节奏，减少不必要的问题。' },
          { b: '障碍成为计划约束', t: '"计划太难"→从低于能力的强度开始；"太忙"→计划内置 15 分钟应急版本。' }
        ],
        refs: [
          { label: 'Noom 历史问题', cls: 'ref-noom' }
        ]
      }
    ]
  },
  {
    label: '日常节奏',
    cards: [
      {
        title: '问节奏，不问频次',
        items: [
          { b: '生活节奏而非时间承诺', t: '不问"每周几次"（用户容易高估），而问"生活节奏"——让 Agent 根据实际情况推算合理频率。' },
          { b: '4 选 1 降低决策疲劳', t: '这个阶段用户已经回答了多轮问题，选项数刻意精简，减少认知消耗。' }
        ],
        refs: [
          { label: 'Whoop 基准期', cls: 'ref-apple' }
        ]
      }
    ]
  },
  {
    label: '启动计划',
    cards: [
      {
        title: '首次价值时刻设计',
        items: [
          { b: '汇总是故事，不是表格', t: 'Agent 用第二人称叙述对用户的理解，每句话都引用了用户说过的具体内容，创造被看见的感受。' },
          { b: '视觉化计划卡', t: '让用户感受到"我的计划已经存在了"，消除仍停留在"要开始"的悬空感。' },
          { b: '第一个行动要小、要今天', t: '"今晚 10 分钟拉伸"而非"明天开始训练"。小的成功确保正向体验，且有仪式感。' },
          { b: '提醒设置是第一个约定', t: '提醒不是通知配置，而是与 Agent 的第一个约定——建立下次互动的期待。' }
        ],
        refs: [

// ═══════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════

let sel = {};
let currentNoteStage = 0;

const STAGES = [
  { title: '初次见面',       sub: '先聊两句，再说训练' },
  { title: '你想改变什么',   sub: '找到你真正的目标' },
  { title: '你的运动经历',   sub: '从你的起点出发' },
  { title: '你平时怎么安排', sub: '计划得适应你的生活' },
  { title: '你的第一个计划', sub: '专属于你的起点' }
];

// ═══════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════

const $  = id => document.getElementById(id);
const $m = () => $('messages');
const $i = () => $('interaction');

function scrollBottom() {
  const m = $m();
  setTimeout(() => m.scrollTop = m.scrollHeight, 60);
}

function setHeader(idx) {
  const s = STAGES[idx];
  $('stageTitle').textContent = s.title;
  $('stageSub').textContent   = s.sub;
  const dots = $('progressSteps').querySelectorAll('.progress-dot');
  dots.forEach((d, i) => {
    d.className = 'progress-dot' + (i < idx ? ' done' : i === idx ? ' active' : '');
  });
  $('progressText').textContent = `${idx + 1} / 5`;
}

// Returns a Promise that resolves after typing → message appears
function agentSay(text, typingMs = 1100) {
  return new Promise(resolve => {
    const tWrap = document.createElement('div');
    tWrap.className = 'typing-wrap';
    tWrap.innerHTML = `
      <div class="avatar">🏃</div>
      <div class="typing-bubble"><i></i><i></i><i></i></div>`;
    $m().appendChild(tWrap);
    scrollBottom();

    setTimeout(() => {
      tWrap.remove();
      const el = document.createElement('div');
      el.className = 'msg agent';
      el.innerHTML = `
        <div class="avatar">🏃</div>
        <div class="bubble">${text.replace(/\n/g, '<br>')}</div>`;
      $m().appendChild(el);
      scrollBottom();
      resolve();
    }, typingMs);
  });
}

function userSay(text) {
  const el = document.createElement('div');
  el.className = 'msg user';
  el.innerHTML = `<div class="bubble">${text}</div>`;
  $m().appendChild(el);
  scrollBottom();
}

function clearInteraction() { $i().innerHTML = ''; }

function wrapInner(el) {
  const div = document.createElement('div');
  div.className = 'interaction-inner';
  div.appendChild(el);
  $i().appendChild(div);
}

// ═══════════════════════════════════════════
// NOTES PANEL
// ═══════════════════════════════════════════

function buildPills() {
  const wrap = $('stagePills');
  wrap.innerHTML = '';
  STAGE_NOTES.forEach((s, i) => {
    const btn = document.createElement('button');
    btn.className = 'pill' + (i === currentNoteStage ? ' active' : '');
    btn.textContent = s.label;
    btn.onclick = () => showNotes(i);
    wrap.appendChild(btn);
  });
}

function showNotes(idx) {
  currentNoteStage = idx;
  buildPills();
  const data = STAGE_NOTES[idx];
  const wrap = $('notesContent');
  wrap.innerHTML = '';
  data.cards.forEach(card => {
    const el = document.createElement('div');
    el.className = 'note-card';
    const refsHtml = (card.refs || []).map(r =>
      `<span class="ref-tag ${r.cls}">${r.label}</span>`).join('');
    el.innerHTML = `
      <div class="note-card-title">${card.title}</div>
      ${card.items.map(it => `
        <div class="note-item">
          <b>${it.b}</b>${it.t}
        </div>`).join('')}
      ${refsHtml ? `<div style="margin-top:8px">${refsHtml}</div>` : ''}
    `;
    wrap.appendChild(el);
  });
}

// ═══════════════════════════════════════════
// STAGE RENDERERS
// ═══════════════════════════════════════════

function startStage0() {
  setHeader(0);
  showNotes(0);

  agentSay('嗨，我是你的运动助手。👋')
    .then(() => agentSay('在给你安排任何训练之前，我想先了解你一下。\n\n你今天来，是什么状态来的？', 1000))
    .then(() => renderMoodGrid());
}

function renderMoodGrid() {
  clearInteraction();
  const inner = document.createElement('div');
  inner.className = 'mood-grid';

  MOODS.forEach(m => {
    const card = document.createElement('div');
    card.className = 'mood-card';
    card.style.background = m.bg;
    card.innerHTML = `
      <span class="mood-emoji">${m.emoji}</span>
      <span class="mood-name">${m.name}</span>
      <span class="mood-desc">${m.desc}</span>`;
    card.onclick = () => onMoodSelect(m);
    inner.appendChild(card);
  });

  wrapInner(inner);
}

function onMoodSelect(mood) {
  sel.mood = mood;
  document.querySelectorAll('.mood-card').forEach(c => {
    c.onclick = null;
    c.classList.add(c.querySelector('.mood-name').textContent === mood.name ? 'selected' : 'dimmed');
  });
  userSay(`${mood.emoji} ${mood.name}`);

  setTimeout(() => {
    clearInteraction();
    setHeader(1);
    showNotes(1);
    agentSay(mood.reply, 1000)
      .then(() => agentSay('你最想解决的是哪一件事？', 700))
      .then(() => renderReasonList());
  }, 300);
}

function renderReasonList() {
  clearInteraction();
  const inner = document.createElement('div');
  inner.className = 'option-list';
  REASONS.forEach(r => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = `
      <span class="opt-icon">${r.icon}</span>
      <div class="opt-text">
        <div class="opt-main">${r.main}</div>
        <div class="opt-sub">${r.sub}</div>
      </div>`;
    btn.onclick = () => onReasonSelect(r);
    inner.appendChild(btn);
  });
  wrapInner(inner);
}

function onReasonSelect(reason) {
  sel.reason = reason;
  document.querySelectorAll('.opt-btn').forEach(b => {
    b.onclick = null;
    const isMe = b.querySelector('.opt-main').textContent === reason.main;
    b.classList.add(isMe ? 'selected' : 'dimmed');
  });
  userSay(`${reason.icon} ${reason.main}`);

  setTimeout(() => {
    clearInteraction();
    setHeader(2);
    showNotes(2);
    agentSay(reason.reply, 1000)
      .then(() => agentSay('练过吗？说说你的运动经历。', 700))
      .then(() => renderPastList());
  }, 300);
}

function renderPastList() {
  clearInteraction();
  const inner = document.createElement('div');
  inner.className = 'option-list';
  PASTS.forEach(p => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = `
      <span class="opt-icon">${p.icon}</span>
      <div class="opt-text">
        <div class="opt-main">${p.main}</div>
        <div class="opt-sub">${p.sub}</div>
      </div>`;
    btn.onclick = () => onPastSelect(p);
    inner.appendChild(btn);
  });
  wrapInner(inner);
}

function onPastSelect(past) {
  sel.past = past;
  document.querySelectorAll('.opt-btn').forEach(b => {
    b.onclick = null;
    const isMe = b.querySelector('.opt-main').textContent === past.main;
    b.classList.add(isMe ? 'selected' : 'dimmed');
  });
  userSay(`${past.icon} ${past.main}`);

  setTimeout(() => {
    clearInteraction();
    if (past.id === 'tried_failed') {
      agentSay('上次是什么让你停了？', 900)
        .then(() => renderObstacleList());
    } else {
      const txt = past.id === 'tried_ok'
        ? '有基础的人适应更快，进步也更明显。\n\n这次我们把训练框架做得更系统一点。'
        : '从零开始有个好处——没有旧的动作习惯需要纠正。\n\n我们把基础打扎实。';
      agentSay(txt, 1000)
        .then(() => goToRhythm());
    }
  }, 300);
}

function renderObstacleList() {
  const inner = document.createElement('div');
  inner.className = 'option-list';
  OBSTACLES.forEach(o => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = `
      <span class="opt-icon">${o.icon}</span>
      <div class="opt-text"><div class="opt-main">${o.main}</div></div>`;
    btn.onclick = () => onObstacleSelect(o);
    inner.appendChild(btn);
  });
  wrapInner(inner);
}

function onObstacleSelect(obs) {
  sel.obstacle = obs;
  document.querySelectorAll('.opt-btn').forEach(b => {
    b.onclick = null;
    const isMe = b.querySelector('.opt-main').textContent === obs.main;
    b.classList.add(isMe ? 'selected' : 'dimmed');
  });
  userSay(`${obs.icon} ${obs.main}`);

  setTimeout(() => {
    clearInteraction();
    agentSay(obs.reply, 1000)
      .then(() => goToRhythm());
  }, 300);
}

function goToRhythm() {
  setHeader(3);
  showNotes(3);
  agentSay('你的日常时间好安排吗？', 700)
    .then(() => renderRhythmList());
}

function renderRhythmList() {
  clearInteraction();
  const inner = document.createElement('div');
  inner.className = 'option-list';
  RHYTHMS.forEach(r => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = `
      <span class="opt-icon">${r.icon}</span>
      <div class="opt-text"><div class="opt-main">${r.main}</div></div>`;
    btn.onclick = () => onRhythmSelect(r);
    inner.appendChild(btn);
  });
  wrapInner(inner);
}

function onRhythmSelect(rhythm) {
  sel.rhythm = rhythm;
  document.querySelectorAll('.opt-btn').forEach(b => {
    b.onclick = null;
    const isMe = b.querySelector('.opt-main').textContent === rhythm.main;
    b.classList.add(isMe ? 'selected' : 'dimmed');
  });
  userSay(`${rhythm.icon} ${rhythm.main}`);

  setTimeout(() => {
    clearInteraction();
    setHeader(4);
    showNotes(4);
    agentSay('好，对你有了基本了解。\n\n给你看看你的起步计划……', 1000)
      .then(() => renderSummary());
  }, 300);
}

function renderSummary() {
  const m   = sel.mood    || MOODS[0];
  const r   = sel.reason  || REASONS[0];
  const obs = sel.obstacle;
  const rh  = sel.rhythm  || RHYTHMS[0];

  let summaryText = `目标是「${r.main}」，${m.name}的状态来的。`;
  if (obs) summaryText += `<br><br>上次卡在「${obs.main}」——这次的计划从这里重新设计。`;
  summaryText += `<br><br>结合你「${rh.main}」的节奏，给你一个真正能执行的安排。`;

  agentSay(summaryText, 1100)
    .then(() => {
      clearInteraction();
      const inner = document.createElement('div');

      // Summary card
      const card = document.createElement('div');
      card.className = 'summary-card';
      const rows = [
        { i: '🎯', t: r.main },
        { i: '📅', t: '每周 3 次，每次 30 分钟起' },
        { i: '🛡️', t: obs ? `针对「${obs.main}」做了弹性设计` : '渐进加量，容错设计' },
        { i: '⚡', t: '今天完成第一个动作' }
      ];
      card.innerHTML = `
        <h4>你的起步计划</h4>
        ${rows.map(row => `
          <div class="summary-row">
            <span class="si">${row.i}</span>
            <span>${row.t}</span>
          </div>`).join('')}`;
      inner.appendChild(card);

      // CTA
      const btn = document.createElement('button');
      btn.className = 'action-btn';
      btn.textContent = '好，就从今天开始 →';
      btn.onclick = () => onStartClick(btn);
      inner.appendChild(btn);

      $i().appendChild(inner);
    });
}

function onStartClick(btn) {
  btn.onclick = null;
  btn.style.opacity = '0.5';
  clearInteraction();

  agentSay('今天不需要开始正式训练。\n\n我给你一件事：\n\n🏃 今晚找 10 分钟，做个简单的全身拉伸。\n\n客厅地板上就行，把身体活动开。完成了来告诉我感觉怎么样。', 1100)
    .then(() => {
      const inner = document.createElement('div');
      const reminderBtn = document.createElement('button');
      reminderBtn.className = 'action-btn';
      reminderBtn.textContent = '⏰ 设置今晚 9:00 提醒';
      reminderBtn.onclick = () => {
        reminderBtn.textContent = '✅ 提醒已设置，今晚 9:00 见';
        reminderBtn.classList.add('success');
        reminderBtn.onclick = null;
        agentSay('好，定好了。今晚 9 点提醒你。\n\n不需要大计划——就先从今晚这 10 分钟开始。💪', 700);
      };
      inner.appendChild(reminderBtn);
      $i().innerHTML = '';
      $i().appendChild(inner);
    });
}

// ═══════════════════════════════════════════
// RESTART
// ═══════════════════════════════════════════

function restart() {
  sel = {};
  $m().innerHTML = '';
  $i().innerHTML = '';
  currentNoteStage = 0;
  startStage0();
}

// ═══════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════

buildPills();
startStage0();
</script>
