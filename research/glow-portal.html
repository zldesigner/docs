<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glow Portal — Dynamic Effect</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  background: #E4E4F0;
}

canvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
}

/* ── CONTROL BAR ── */
.ui {
  position: fixed;
  bottom: 32px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 10px;
  background: rgba(8, 8, 20, 0.55);
  border: 1px solid rgba(255,255,255,0.08);
  padding: 10px 18px;
  border-radius: 50px;
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  z-index: 100;
}

.ui-label {
  font-family: -apple-system, 'PingFang SC', sans-serif;
  font-size: 11px;
  color: rgba(255,255,255,0.32);
  letter-spacing: 0.06em;
  user-select: none;
}

.swatch {
  width: 26px; height: 26px;
  border-radius: 50%;
  cursor: pointer;
  border: 2.5px solid transparent;
  transition: transform 0.18s, border-color 0.22s;
  flex-shrink: 0;
}
.swatch:hover { transform: scale(1.18); }
.swatch.active {
  border-color: rgba(255,255,255,0.88);
  transform: scale(1.12);
}

.divider {
  width: 1px; height: 20px;
  background: rgba(255,255,255,0.1);
  margin: 0 2px;
}

/* Custom color picker */
.custom-wrap {
  position: relative;
  width: 26px; height: 26px;
  border-radius: 50%;
  border: 2px dashed rgba(255,255,255,0.3);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: border-color 0.18s, transform 0.18s;
  overflow: hidden;
}
.custom-wrap:hover {
  border-color: rgba(255,255,255,0.6);
  transform: scale(1.12);
}
.custom-wrap .plus {
  font-size: 15px;
  color: rgba(255,255,255,0.45);
  pointer-events: none;
  line-height: 1;
}
.custom-wrap input[type=color] {
  position: absolute; inset: 0;
  opacity: 0;
  width: 100%; height: 100%;
  cursor: pointer; border: none;
}

/* Intensity / Speed sliders */
.knob-wrap {
  display: flex; align-items: center; gap: 7px;
}
.knob-label {
  font-family: -apple-system, 'PingFang SC', sans-serif;
  font-size: 11px;
  color: rgba(255,255,255,0.32);
  letter-spacing: 0.05em;
  user-select: none;
  white-space: nowrap;
}
input[type=range] {
  -webkit-appearance: none;
  width: 64px; height: 3px;
  border-radius: 2px;
  background: rgba(255,255,255,0.14);
  outline: none; cursor: pointer;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 13px; height: 13px;
  border-radius: 50%;
  background: rgba(255,255,255,0.78);
  cursor: pointer;
  transition: background 0.15s;
}
input[type=range]::-webkit-slider-thumb:hover { background: #fff; }
</style>
</head>
<body>

<canvas id="c"></canvas>
<div class="ui" id="ui"></div>

<script>
// ═══════════════════════════════════════════════
// PALETTES
// ═══════════════════════════════════════════════

const PALETTES = [
  {
    id: 'royal',  label: '皇家蓝',
    glow: [26,  68, 255],
    mid:  [80, 140, 255],
    bg:   [228, 228, 244],
    swatch: '#1A44FF'
  },
  {
    id: 'violet', label: '深紫',
    glow: [120,  20, 255],
    mid:  [180, 100, 255],
    bg:   [236, 228, 248],
    swatch: '#7814FF'
  },
  {
    id: 'cyan',   label: '极光蓝',
    glow: [0,  155, 255],
    mid:  [80, 200, 255],
    bg:   [228, 240, 250],
    swatch: '#009BFF'
  },
  {
    id: 'teal',   label: '翡翠',
    glow: [0,  200, 140],
    mid:  [60, 240, 180],
    bg:   [224, 244, 238],
    swatch: '#00C88C'
  },
  {
    id: 'rose',   label: '玫瑰',
    glow: [255,  40,  80],
    mid:  [255, 120, 150],
    bg:   [248, 228, 232],
    swatch: '#FF2850'
  },
  {
    id: 'gold',   label: '暖金',
    glow: [255, 160,   0],
    mid:  [255, 210,  80],
    bg:   [248, 240, 224],
    swatch: '#FFA000'
  },
];

let pal = PALETTES[0];
let speedMult = 1.0;
let glowIntensity = 1.0;

// ═══════════════════════════════════════════════
// CANVAS
// ═══════════════════════════════════════════════

const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// ═══════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════

function rgba(r, g, b, a) {
  return `rgba(${Math.round(r)},${Math.round(g)},${Math.round(b)},${a.toFixed(3)})`;
}

function lerpC(a, b, t) {
  return [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t];
}

// Rounded rect path (pill-friendly)
function pill(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y,     x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x,     y + h, r);
  ctx.arcTo(x,     y + h, x,     y,     r);
  ctx.arcTo(x,     y,     x + w, y,     r);
  ctx.closePath();
}

// Custom color → palette
function hexToRgb(hex) {
  hex = hex.replace('#', '');
  return [parseInt(hex.slice(0,2),16), parseInt(hex.slice(2,4),16), parseInt(hex.slice(4,6),16)];
}

function buildCustomPal(hex) {
  const g = hexToRgb(hex);
  const m = lerpC(g, [255,255,255], 0.45);
  const b = lerpC(g, [240,240,240], 0.88);
  return { id:'custom', label:'自定义', glow:g, mid:m, bg:b, swatch:hex };
}

// ═══════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════

const GLOW_LAYERS = 9; // number of blur passes

let t = 0, lastTime = 0;

function render(now) {
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;
  t += dt * speedMult;

  // ── Pulse signals ──────────────────────────────
  // Primary breathing
  const breathe  = 0.5 + 0.5 * Math.sin(t * 1.1);
  // Secondary shimmer (slightly different frequency)
  const shimmer  = 0.5 + 0.5 * Math.sin(t * 1.7 + 0.8);
  // Slow outer pulse
  const outerPulse = 0.5 + 0.5 * Math.sin(t * 0.55 + 0.3);

  // ── Shape geometry ─────────────────────────────
  const baseSize = Math.min(W, H);
  const sw = baseSize * 0.58;                  // shape width
  const sh = sw * 0.36;                        // shape height (~3:1 ratio)
  const cr = sh * 0.48;                        // corner radius (near pill)
  const cx = W / 2, cy = H / 2;

  // Breathing modulates shape scale slightly
  const bScale = 1 + 0.018 * Math.sin(t * 0.9);
  const dw = sw * bScale, dh = sh * bScale, dr = cr * bScale;

  // ── Effective glow intensity ───────────────────
  const intens = glowIntensity * (0.78 + 0.22 * breathe);

  // ── 1. Background ──────────────────────────────
  const [bgR, bgG, bgB] = pal.bg;
  ctx.fillStyle = rgba(bgR, bgG, bgB, 1);
  ctx.fillRect(0, 0, W, H);

  // ── 2. Glow layers (largest/most transparent → smallest/most opaque) ──
  for (let i = GLOW_LAYERS; i >= 0; i--) {
    const tOuter = i / GLOW_LAYERS;          // 1 = outermost, 0 = innermost
    const tInner = 1 - tOuter;

    // How much this layer expands beyond the dark shape
    const maxExpand = baseSize * 0.28 * (0.8 + 0.2 * outerPulse);
    const expand = tOuter * maxExpand;

    // Blur amount: outer layers are blurrier
    const blurPx = 6 + tOuter * 70;

    // Opacity: outer layers fade out, inner layers brighter
    const baseAlpha = (0.03 + tInner * 0.55) * intens;

    // Color: inner = vivid glow, outer = bleeds toward background tint
    const colorT = Math.pow(tOuter, 0.55);
    const nearBg  = lerpC(pal.glow, pal.bg, 0.65); // bg-tinted edge
    const layerC  = lerpC(pal.glow, nearBg, colorT);

    // Layer dimensions
    const lw = dw + expand * 2;
    const lh = dh + expand * 2;
    const lr = dr + expand;
    const lx = cx - lw / 2;
    const ly = cy - lh / 2;

    ctx.save();
    ctx.filter = `blur(${blurPx.toFixed(1)}px)`;
    ctx.globalAlpha = baseAlpha;
    ctx.fillStyle = rgba(...layerC, 1);
    pill(lx, ly, lw, lh, lr);
    ctx.fill();
    ctx.restore();
  }

  // ── 3. Bright edge ring (crisp halo just outside dark shape) ──────────
  // Drawn without blur — creates the vivid "corona" at shape boundary
  {
    const ringExpand = 4 + 3 * shimmer;
    const ringAlpha  = (0.55 + 0.15 * shimmer) * intens;
    ctx.save();
    ctx.filter = `blur(${(5 + 4 * shimmer).toFixed(1)}px)`;
    ctx.globalAlpha = ringAlpha;
    ctx.fillStyle = rgba(...pal.mid, 1);
    pill(cx - (dw + ringExpand * 2) / 2, cy - (dh + ringExpand * 2) / 2,
         dw + ringExpand * 2, dh + ringExpand * 2,
         dr + ringExpand);
    ctx.fill();
    ctx.restore();
  }

  // ── 4. Dark center ─────────────────────────────
  // Two-tone radial gradient: slightly lighter at very center (screen glare)
  const darkGrad = ctx.createRadialGradient(cx, cy - dh * 0.08, 0, cx, cy, Math.max(dw, dh) * 0.6);
  darkGrad.addColorStop(0,   '#0D0D1A'); // very slightly less dark center
  darkGrad.addColorStop(0.5, '#060610');
  darkGrad.addColorStop(1,   '#030308');
  ctx.fillStyle = darkGrad;
  pill(cx - dw / 2, cy - dh / 2, dw, dh, dr);
  ctx.fill();

  // ── 5. Inner rim glow (light bleeding INTO the dark shape at edges) ────
  // This creates the subtle blue-lit edge inside the dark rect
  ctx.save();
  ctx.filter = `blur(${(20 + 8 * shimmer).toFixed(1)}px)`;
  ctx.globalAlpha = (0.18 + 0.08 * shimmer) * intens;
  ctx.fillStyle = rgba(...pal.mid, 1);
  pill(cx - dw / 2, cy - dh / 2, dw, dh, dr);
  ctx.fill();
  // Then re-darken the true center so the glow doesn't wash it out
  ctx.filter = 'none';
  ctx.globalAlpha = 1;
  const recenterGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(dw, dh) * 0.4);
  recenterGrad.addColorStop(0,   rgba(3, 3, 10, 0.96));
  recenterGrad.addColorStop(1,   'transparent');
  ctx.fillStyle = recenterGrad;
  pill(cx - dw / 2, cy - dh / 2, dw, dh, dr);
  ctx.fill();
  ctx.restore();

  requestAnimationFrame(render);
}

// ═══════════════════════════════════════════════
// UI
// ═══════════════════════════════════════════════

const ui = document.getElementById('ui');
let activeSw = null;

function selectPal(p, swEl) {
  pal = p;
  document.body.style.background = `rgb(${p.bg.join(',')})`;
  if (activeSw) activeSw.classList.remove('active');
  activeSw = swEl;
  if (swEl) swEl.classList.add('active');
}

// Label
const lbl = document.createElement('span');
lbl.className = 'ui-label';
lbl.textContent = '颜色';
ui.appendChild(lbl);

// Preset swatches
PALETTES.forEach((p, i) => {
  const sw = document.createElement('div');
  sw.className = 'swatch' + (i === 0 ? ' active' : '');
  sw.style.background = p.swatch;
  sw.title = p.label;
  sw.onclick = () => selectPal(p, sw);
  if (i === 0) activeSw = sw;
  ui.appendChild(sw);
});

// Custom color picker
const cWrap = document.createElement('div');
cWrap.className = 'custom-wrap';
cWrap.title = '自定义颜色';
const plus = document.createElement('span');
plus.className = 'plus';
plus.textContent = '+';
const cIn = document.createElement('input');
cIn.type = 'color';
cIn.value = '#0044ff';
cIn.oninput = () => {
  const cp = buildCustomPal(cIn.value);
  cWrap.style.background = cIn.value;
  cWrap.style.borderStyle = 'solid';
  plus.style.display = 'none';
  selectPal(cp, null);
};
cWrap.appendChild(plus);
cWrap.appendChild(cIn);
ui.appendChild(cWrap);

// Divider
const d1 = document.createElement('div');
d1.className = 'divider';
ui.appendChild(d1);

// Glow intensity slider
const gWrap = document.createElement('div');
gWrap.className = 'knob-wrap';
const gLbl = document.createElement('span');
gLbl.className = 'knob-label';
gLbl.textContent = '强度';
const gIn = document.createElement('input');
gIn.type = 'range'; gIn.min = '10'; gIn.max = '100'; gIn.value = '75';
gIn.oninput = () => { glowIntensity = 0.2 + (gIn.value / 100) * 1.2; };
glowIntensity = 0.2 + (75 / 100) * 1.2;
gWrap.appendChild(gLbl);
gWrap.appendChild(gIn);
ui.appendChild(gWrap);

// Speed slider
const sWrap = document.createElement('div');
sWrap.className = 'knob-wrap';
const sLbl = document.createElement('span');
sLbl.className = 'knob-label';
sLbl.textContent = '速度';
const sIn = document.createElement('input');
sIn.type = 'range'; sIn.min = '0'; sIn.max = '100'; sIn.value = '35';
sIn.oninput = () => { speedMult = 0.05 + (sIn.value / 100) * 3.0; };
speedMult = 0.05 + (35 / 100) * 3.0;
sWrap.appendChild(sLbl);
sWrap.appendChild(sIn);
ui.appendChild(sWrap);

// ═══════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════

document.body.style.background = `rgb(${PALETTES[0].bg.join(',')})`;

requestAnimationFrame(ts => { lastTime = ts; render(ts); });
</script>
</body>
</html>
