<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal Glow — WebGL Shader</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 100vw; height: 100vh;
  overflow: hidden;
  background: #E8E8EE;
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
}
canvas {
  position: fixed;
  inset: 0;
  width: 100%; height: 100%;
  display: block;
}
/* ── Control Bar ── */
.ui {
  position: fixed;
  bottom: 28px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 14px;
  background: rgba(10, 10, 18, 0.78);
  backdrop-filter: blur(22px) saturate(180%);
  -webkit-backdrop-filter: blur(22px) saturate(180%);
  border: 1px solid rgba(255,255,255,0.10);
  border-radius: 48px;
  padding: 10px 20px;
  box-shadow: 0 8px 40px rgba(0,0,0,0.35);
}
.swatch {
  width: 24px; height: 24px;
  border-radius: 50%;
  cursor: pointer;
  border: 2px solid transparent;
  flex-shrink: 0;
  transition: transform 0.16s ease, border-color 0.16s ease;
}
.swatch:hover { transform: scale(1.18); }
.swatch.active { border-color: #fff; transform: scale(1.12); }
.custom-wrap {
  width: 24px; height: 24px;
  border-radius: 50%;
  border: 2px solid rgba(255,255,255,0.22);
  flex-shrink: 0;
  cursor: pointer;
  overflow: hidden;
  position: relative;
}
.custom-wrap::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: conic-gradient(red, yellow, lime, cyan, blue, magenta, red);
}
.custom-wrap input[type=color] {
  position: absolute; inset: -4px;
  width: 32px; height: 32px;
  border: none; opacity: 0; cursor: pointer;
}
.divider {
  width: 1px; height: 20px;
  background: rgba(255,255,255,0.12);
  flex-shrink: 0;
}
.knob {
  display: flex;
  align-items: center;
  gap: 8px;
}
.knob label {
  color: rgba(255,255,255,0.38);
  font-size: 10px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  white-space: nowrap;
  user-select: none;
}
input[type=range] {
  -webkit-appearance: none;
  width: 80px; height: 3px;
  border-radius: 2px;
  background: rgba(255,255,255,0.14);
  outline: none; cursor: pointer;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 13px; height: 13px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 1px 5px rgba(0,0,0,0.4);
}
input[type=range]::-moz-range-thumb {
  width: 13px; height: 13px;
  border-radius: 50%;
  background: #fff;
  border: none;
}
</style>
</head>
<body>
<canvas id="glc"></canvas>
<div class="ui">
  <div id="swatches" style="display:flex;gap:7px;align-items:center"></div>
  <div class="custom-wrap" title="自定义颜色">
    <input type="color" id="colorPick" value="#3B82FF">
  </div>
  <div class="divider"></div>
  <div class="knob">
    <label>强度</label>
    <input type="range" id="sIntensity" min="0.2" max="2.5" step="0.05" value="1.0">
  </div>
  <div class="knob">
    <label>速度</label>
    <input type="range" id="sSpeed" min="0.05" max="3.0" step="0.05" value="0.7">
  </div>
  <div class="divider"></div>
  <div class="knob">
    <label>模糊</label>
    <input type="range" id="sBlur" min="0.2" max="4.0" step="0.05" value="1.0">
  </div>
</div>
<script>
// ── Colour presets ──
const PRESETS = [
  { name: '电蓝', hex: '#3B82FF', rgb: [0.231, 0.510, 1.000] },
  { name: '极光', hex: '#34D399', rgb: [0.204, 0.827, 0.600] },
  { name: '紫幻', hex: '#A855F7', rgb: [0.659, 0.333, 0.969] },
  { name: '玫光', hex: '#F43F5E', rgb: [0.957, 0.247, 0.369] },
  { name: '橙核', hex: '#F97316', rgb: [0.976, 0.451, 0.086] },
  { name: '冰蓝', hex: '#BAE6FD', rgb: [0.729, 0.902, 0.992] },
];

let glowColor = [...PRESETS[0].rgb];
let intensity  = 1.0;
let speed      = 0.7;
let blur       = 1.0;
let accumTime  = 0.0;
let lastTs     = null;

const swatchesEl = document.getElementById('swatches');
PRESETS.forEach((p, i) => {
  const d = document.createElement('div');
  d.className = 'swatch' + (i === 0 ? ' active' : '');
  d.title = p.name;
  d.style.background = p.hex;
  d.onclick = () => {
    glowColor = [...p.rgb];
    document.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
    d.classList.add('active');
  };
  swatchesEl.appendChild(d);
});

document.getElementById('colorPick').oninput = e => {
  const h = e.target.value;
  glowColor = [
    parseInt(h.slice(1,3), 16) / 255,
    parseInt(h.slice(3,5), 16) / 255,
    parseInt(h.slice(5,7), 16) / 255,
  ];
  document.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
};
document.getElementById('sIntensity').oninput = e => intensity = +e.target.value;
document.getElementById('sSpeed').oninput     = e => speed     = +e.target.value;
document.getElementById('sBlur').oninput      = e => blur      = +e.target.value;

// ── WebGL setup ──
const canvas = document.getElementById('glc');
const gl = canvas.getContext('webgl', { antialias: false, alpha: false });
if (!gl) {
  document.body.innerHTML = '<p style="color:#333;padding:40px;font-size:18px">Your browser does not support WebGL.</p>';
  throw new Error('no webgl');
}

// ── Vertex shader: full-screen triangle strip quad ──
const VS = `
attribute vec2 aPos;
void main() { gl_Position = vec4(aPos, 0.0, 1.0); }
`;

// ── Fragment shader: SDF-based portal glow with organic morphing ──
const FS = `
precision highp float;

uniform float uTime;
uniform vec3  uColor;
uniform float uIntensity;
uniform float uBlur;       /* softness: >1 = softer/wider, <1 = tighter */
uniform vec2  uResolution;

/* Rounded-rectangle signed distance function.
   p = sample point, b = half-extents, r = corner radius. */
float sdRoundBox(vec2 p, vec2 b, float r) {
  vec2 q = abs(p) - b + r;
  return length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - r;
}

/* Value noise — smooth 1-D random */
float hash(float n) { return fract(sin(n) * 43758.5453); }
float vnoise(float t) {
  float i = floor(t);
  float f = fract(t);
  float u = f * f * (3.0 - 2.0 * f);
  return mix(hash(i), hash(i + 1.0), u);
}

/* Organic variation: sum of sines at incommensurable frequencies + noise.
   Produces smooth, deterministic, aperiodic drift. */
float organic(float t, float seed) {
  return  sin(t * 0.713 + seed)         * 0.42
        + sin(t * 0.371 + seed * 1.618) * 0.30
        + sin(t * 1.137 + seed * 0.577) * 0.18
        + vnoise(t * 0.19  + seed)       * 0.10;
}

void main() {
  /* UV in [-0.5..0.5] normalised by shortest screen dimension */
  vec2 uv = (gl_FragCoord.xy - uResolution * 0.5) / min(uResolution.x, uResolution.y);

  /* ── Organic shape parameters ── */
  float mw = organic(uTime, 0.00);   /* width  morph  */
  float mh = organic(uTime, 3.14);   /* height morph  */
  float mr = organic(uTime, 1.57);   /* radius morph  */
  float mx = organic(uTime, 5.00);   /* x-drift       */
  float my = organic(uTime, 2.72);   /* y-drift       */

  float w = 0.285 + mw * 0.020;      /* half-width    */
  float h = 0.090 + mh * 0.011;      /* half-height   */
  float r = 0.072 + mr * 0.010;      /* corner radius */
  r = clamp(r, 0.010, min(w, h) - 0.003);

  vec2 center = vec2(mx * 0.009, my * 0.006);  /* subtle drift */

  float dist = sdRoundBox(uv - center, vec2(w, h), r);

  /* ── Glow: exponential falloff layers outside the shape ──
     Dividing the decay rate by uBlur makes the falloff wider (softer)
     when uBlur > 1 and narrower (sharper) when uBlur < 1.              */
  float d      = max(dist, 0.0);
  float inv    = 1.0 / max(uBlur, 0.05);
  float gTight = exp(-d * 32.0 * inv);           /* tight bright halo  */
  float gMid   = exp(-d * 11.0 * inv) * 0.50;   /* mid-range diffuse  */
  float gBroad = exp(-d *  3.8 * inv) * 0.25;   /* wide ambient bloom */
  float gTotal  = (gTight + gMid + gBroad) * uIntensity;

  /* ── Rim: stays mostly sharp; blur widens it gently ── */
  float rimW   = 0.010 * clamp(uBlur, 0.4, 2.0);
  float rimOut  = smoothstep( rimW,    0.000, dist);
  float rimIn   = smoothstep(-rimW * 1.4, -0.002, dist);
  float rim     = rimOut * rimIn * uIntensity * 0.60;

  /* ── Colour composition ── */
  vec3 bg   = vec3(0.910, 0.910, 0.920);   /* light-gray background */
  vec3 dark = vec3(0.060, 0.060, 0.075);   /* near-black pill       */

  /* Additive glow: adds light energy over the background */
  vec3 col = bg + uColor * gTotal + uColor * rim;

  /* Blend dark pill interior using sharp smoothstep mask */
  float mask = smoothstep(0.004, -0.004, dist);
  col = mix(col, dark, mask);

  gl_FragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
}
`;

function mkShader(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    console.error('Shader compile error:', gl.getShaderInfoLog(s));
  }
  return s;
}

const prog = gl.createProgram();
gl.attachShader(prog, mkShader(gl.VERTEX_SHADER,   VS));
gl.attachShader(prog, mkShader(gl.FRAGMENT_SHADER, FS));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
  console.error('Program link error:', gl.getProgramInfoLog(prog));
}
gl.useProgram(prog);

/* Full-screen quad as two triangles (TRIANGLE_STRIP) */
const vb = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, vb);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
const aPosLoc = gl.getAttribLocation(prog, 'aPos');
gl.enableVertexAttribArray(aPosLoc);
gl.vertexAttribPointer(aPosLoc, 2, gl.FLOAT, false, 0, 0);

const uTimeLoc  = gl.getUniformLocation(prog, 'uTime');
const uColorLoc = gl.getUniformLocation(prog, 'uColor');
const uIntenLoc = gl.getUniformLocation(prog, 'uIntensity');
const uBlurLoc  = gl.getUniformLocation(prog, 'uBlur');
const uResLoc   = gl.getUniformLocation(prog, 'uResolution');

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width  = Math.round(canvas.clientWidth  * dpr);
  canvas.height = Math.round(canvas.clientHeight * dpr);
  gl.viewport(0, 0, canvas.width, canvas.height);
}
window.addEventListener('resize', resize);
resize();

/* ── Render loop ── */
function frame(ts) {
  if (lastTs !== null) accumTime += (ts - lastTs) / 1000 * speed;
  lastTs = ts;

  gl.uniform1f(uTimeLoc,   accumTime);
  gl.uniform3fv(uColorLoc, glowColor);
  gl.uniform1f(uIntenLoc,  intensity);
  gl.uniform1f(uBlurLoc,   blur);
  gl.uniform2f(uResLoc,    canvas.width, canvas.height);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
